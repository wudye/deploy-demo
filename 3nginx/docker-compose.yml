services:
  nginx:
    image: nginx:latest
    container_name: nginx
    command: /bin/bash -c "nginx -g 'daemon off;'"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - web-net