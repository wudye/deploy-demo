port 5000
dir "/usr/local/etc/redis"

sentinel auth-pass mymaster 123456

# sentinel monitor master-group-name hostname port quorum
# mymaster、resque 是每个 redis 主从集群分配一个逻辑的名称
# quorum 的解释如下：
#  至少多少个哨兵要一致同意，master 进程挂掉了，或者 slave 进程挂掉了，或者要启动一个故障转移操作
#  quorum 是用来识别故障的，真正执行故障转移的时候，还是要在哨兵集群执行选举，选举一个哨兵进程出来执行故障转移操作
sentinel monitor mymaster 172.28.10.12 6379 2
# 超过多少毫秒跟一个 redis 实例断了连接，哨兵就可能认为这个 redis 实例挂了
sentinel down-after-milliseconds mymaster 60000
#执行故障转移的 timeout 超时时长

# 新的 master 切换之后，同时有多少个 slave 被切换到去连接新 master，重新做同步，数字越低，花费的时间越多

# 如果 resque 真的是你要当作主来高可用的 Redis，则监控它是合理；否则不要把从节点设为一个独立的监控目标。正确做法通常是只用 Sentinel 去监控真正的主节点（例如 mymaster），从节点只作为候选被提升。
# sentinel monitor resque 172.28.10.11 6379 2
# sentinel down-after-milliseconds resque 10000
# sentinel failover-timeout resque 180000
# sentinel parallel-syncs resque 5
# Generated by CONFIG REWRITE
latency-tracking-info-percentiles 50 99 99.9
user default on nopass sanitize-payload ~* &* +@all
sentinel myid a0b8ef5dde35a2c3a4814ba8886687f276ed2702
sentinel config-epoch mymaster 1
sentinel leader-epoch mymaster 1
sentinel current-epoch 1

sentinel known-replica mymaster 172.28.10.10 6379

sentinel known-replica mymaster 172.28.10.11 6379

sentinel known-sentinel mymaster 172.28.10.21 5000 bff7e4bc2389ae31015e4537932a5fdac04c524a

sentinel known-sentinel mymaster 172.28.10.22 5000 1c4c78bf06dc8f45531d10e0165f700aed4ccead

