apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: default

spec:
    replicas: 1
    selector:
        matchLabels:
            app: redis
    template:
        metadata:
            labels:
                app: redis
        spec:
            containers:
                - name: redis
                  image: redis:latest
                  args: ["redis-server", "--appendonly", "yes"]
                  ports:
                      - containerPort: 6379
                  volumeMounts:
                      - name: redis-data
                        mountPath: /data
                  readinessProbe:
                        exec:
                            command: ["redis-cli", "ping"]
                        initialDelaySeconds: 3
                        periodSeconds: 5
                        timeoutSeconds: 3
                        failureThreshold: 10
                  livenessProbe:
                        exec:
                            command: ["redis-cli", "ping"]
                        initialDelaySeconds: 10
                        periodSeconds: 10
                        timeoutSeconds: 3
                        failureThreshold: 10
            volumes:
                - name: redis-data
                  persistentVolumeClaim:
                      claimName: redis-data