apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
- name: config
  literals:
    - app.message=Hello Kubernetes!

generatorOptions:
  # 控制是否添加哈希后缀
  disableNameSuffixHash: false  # false = 启用哈希（推荐），true = 禁用哈希
  
  # 添加标签
  labels:
    app.kubernetes.io/name: demo-app
    app.kubernetes.io/component: config
    managed-by: kustomize
  
  # 添加注解
  annotations:
    config.kubernetes.io/origin: "generated-by-kustomize"
    config.kubernetes.io/version: "1.0.0"