apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spring-on-k8s
resources:
- namespace.yml
- deployment.yml
- service.yml

configMapGenerator:
- name: config
  literals:
    - app.message=Hello Kubernetes!
  
- name: app-properties
  files:
  - config/app.properties
  
- name: nginx-config
  files:
  - config/nginx.conf
  
generatorOptions:
  disableNameSuffixHash: false  # 启用哈希后缀
  labels:
    generated-by: kustomize
    environment: production