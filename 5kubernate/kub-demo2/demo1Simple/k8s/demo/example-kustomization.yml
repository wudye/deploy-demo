apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spring-on-k8s
resources:
- namespace.yml
- deployment.yml
- service.yml

configMapGenerator:
- name: app-config
  literals:
    - app.name=DemoApplication
    - app.version=1.0.0
    - app.message=Hello from Kustomize!
    - database.url=jdbc:postgresql://db:5432/myapp
    - database.maxConnections=10
    - cache.ttl=300
    - debug.enabled=true

- name: api-config
  literals:
    - api.timeout=5000
    - api.retries=3
    - api.rateLimit=100