spring:
  application:
    name: Whatsappclone

  config:
    import: optional:file:.env

  # ============================================
  # 虚拟线程配置（通用）
  # ============================================
  threads:
    virtual:
      enabled: true

  # ============================================
  # MySQL 数据源配置
  # ============================================
  datasource:
    # HikariCP 连接池配置
    hikari:
      # 连接池名称
      poolName: Hikari-MySQL

      # 自动提交（false 由事务管理器控制）
      auto-commit: false

      # 连接池大小（MySQL 建议稍大）
      maximum-pool-size: 30
      minimum-idle: 15

      # 连接超时设置
      connection-timeout: 30000        # 30 秒
      idle-timeout: 600000             # 10 分钟
      max-lifetime: 1800000            # 30 分钟

      # 连接测试配置
      connection-test-query: SELECT 1
      validation-timeout: 5000         # 5 秒

      # 泄漏检测
      leak-detection-threshold: 60000  # 1 分钟（开发环境）

    # MySQL 连接参数
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DB:whatsappclone}?\
      useSSL=${MYSQL_SSL:false}&\
      useUnicode=true&\
      characterEncoding=UTF-8&\
      serverTimezone=Europe/Vienna&\
      allowPublicKeyRetrieval=true&\
      useLocalSessionState=true&\
      rewriteBatchedStatements=true&\
      cachePrepStmts=true&\
      prepStmtCacheSize=250&\
      prepStmtCacheSqlLimit=2048&\
      useServerPrepStmts=true&\
      useLocalTransactionState=true&\
      zeroDateTimeBehavior=convertToNull&\
      connectTimeout=30000&\
      socketTimeout=30000&\
      autoReconnect=true&\
      failOverReadOnly=false&\
      maxReconnects=3

    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource

  # ============================================
  # JPA 仓库配置
  # ============================================
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  # ============================================
  # JPA/Hibernate 配置
  # ============================================
  jpa:
    properties:
      hibernate:
        # ============================================
        # JDBC 配置
        # ============================================
        jdbc:
          # 时区设置（MySQL 必须设置）
          time_zone: Europe/Vienna

          # 批量操作配置
          batch_size: 25
          batch_versioned_data: false  # MySQL 不支持

          # 获取批量大小
          fetch_size: 100

          # 批量插入优化
          order_inserts: true
          order_updates: true

          # MySQL 批量优化
          batch_versioned_data: false
          use_streams_for_binary: true
          lob.non_contextual_creation: true

        # ============================================
        # 查询优化
        # ============================================
        query:
          # 分页集合抓取失败检测
          fail_on_pagination_over_collection_fetch: true

          # IN 子句参数填充
          in_clause_parameter_padding: true

          # 查询缓存
          cache_queries: true

          # 查询计划缓存
          query_plan_cache_max_size: 2048
          query_plan_cache_max_strong_reference_count: 128

        # ============================================
        # 统计信息
        # ============================================
        generate_statistics: false  # 生产环境
        show_sql: true
        format_sql: true
        use_sql_comments: true

        # ============================================
        # 连接配置
        # ============================================
        connection:
          provider_disables_autocommit: true
          autocommit: false
          release_mode: auto

          # 连接池提供者
          provider_class: org.hibernate.hikaricp.internal.HikariCPConnectionProvider

        # ============================================
        # 命名策略
        # ============================================
        implicit_naming_strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

        # ============================================
        # 缓存配置
        # ============================================
        cache:
          use_second_level_cache: false
          use_query_cache: false
          region:
            factory_class: org.hibernate.cache.jcache.JCacheRegionFactory

        # ============================================
        # DDL 配置
        # ============================================
        ddl-auto: none
        # ddl-auto: validate  # 开发环境
        # ddl-auto: update    # 测试环境

        # ============================================
        # 方言配置
        # ============================================
        dialect: org.hibernate.dialect.MySQLDialect
        # dialect: org.hibernate.dialect.MySQL8Dialect    # MySQL 8.0+
        # dialect: org.hibernate.dialect.MySQL57Dialect   # MySQL 5.7
        # dialect: org.hibernate.dialect.MySQL5InnoDBDialect

    # ============================================
    # Open Session In View
    # ============================================
    open-in-view: false

  # ============================================
  # Flyway 配置（数据库迁移）
  # ============================================
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    out-of-order: false
    validate-on-migrate: true

  # ============================================
  # Liquibase 配置（替代 Flyway）
  # ============================================
  liquibase:
    enabled: false  # 如果使用 Flyway，禁用 Liquibase
    change-log: classpath:db/changelog/master.xml
    contexts: dev

# ============================================
# 服务器配置
# ============================================
server:
  port: 8080
  compression:
    enabled: true
  tomcat:
    threads:
      max: 200
      min-spare: 10

# ============================================
# 日志配置
# ============================================
logging:
  level:
    ROOT: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG
    com.mwu.whatsappclone: INFO

# ============================================
# 管理端点配置
# ============================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
