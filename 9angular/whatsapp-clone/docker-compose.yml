version: '3.9'
services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: whatsappclone
      POSTGRES_USER: whatsappclone
      POSTGRES_PASSWORD: whatsappclone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgresql_init:/docker-entrypoint-initdb.d

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: 'start-dev'
#    volumes:
#      - ./keycloak-realm-config:/opt/keycloak/data/import
    environment:
      - KC_DB=dev-file
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_FEATURES=scripts
      - KC_HTTP_PORT=9080
      - KC_HTTPS_PORT=9443
    ports:
      - '9080:9080'
      - '9443:9443'
volumes:
  pgdata:


