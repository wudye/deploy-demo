spring:
  application:
    name: Whatsappclone
  config:
    import: optional:file:.env
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      poolName: Hikari
      auto-commit: false
    password: ${POSTGRESQL_USER}
    username: ${POSTGRESQL_PASSWORD}
    url: jdbc:postgresql://${POSTGRESQL_HOST:localhost}:5432/${POSTGRESQL_DB}
    driver-class-name: org.postgresql.Driver
    type: com.zaxxer.hikari.HikariDataSource
  data:
    jpa:
      repositories:
        bootstrap-mode: deferred
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Vienna
          batch_size: 25
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
        generate_statistics: false
        show_sql: true
        format_sql: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        order_inserts: true
        default_schema: whatsappclone
    hibernate:
      ddl-auto: none
      naming:
        implicit-strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/master.xml
    default-schema: whatsappclone
    contexts: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9080/realms/whatsapp-clone
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080


logging:
  level:
    ROOT: INFO
    org.hibernate.SQL: INFO
    com.mwu.whatsappclone: INFO
    org.springframework: DEBUG
  file:
    path: ./logs
    name: authorization.log
