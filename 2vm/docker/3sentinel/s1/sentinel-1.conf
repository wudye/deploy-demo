# sentinel.conf（通用，三个节点上配置基本相同）

# 监听端口
port 26379

# 绑定地址（如需监听所有接口，设为 0.0.0.0；建议限制为特定 IP）
bind 0.0.0.0

# 关闭保护模式（Docker 环境常见）
protected-mode no

# 监控 master，设置 quorum = 2
# Format: sentinel monitor <name> <ip> <port> <quorum>
sentinel monitor mymaster 192.168.80.129 6379 2

# Master 的认证密码（若 Redis 配置了 requirepass）
sentinel auth-pass mymaster 123456

# Master 在多少毫秒无响应后被认为不可达（默认 30000ms）
sentinel down-after-milliseconds mymaster 3000

# 故障转移超时（ms）：多久内必须完成 failover（默认 180000ms）
sentinel failover-timeout mymaster 10000

# Parallel syncs（故障转移时有多少个 replica 可以同时与新 master 同步）
sentinel parallel-syncs mymaster 1

# 日志级别
loglevel notice

# 日志文件路径（Docker 内部通常输出到 stdout，此项可选）
# logfile ""

# 工作目录（用于持久化状态）
dir /data

# 如需 Sentinel 之间的认证（可选，Redis 6.2+）
# sentinel auth-user mymaster default
# sentinel auth-pass mymaster <password>