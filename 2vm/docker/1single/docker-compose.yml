version: "3.8"
services:
  redis1:
    image: redis:latest
    container_name: cluster_redis1
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis1/redis.conf:/usr/local/etc/redis/redis.conf
      - ./redis1_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  redis1_data:

