daemonize no
bind 0.0.0.0
port 6379
protected-mode no

save 900 1
save 300 10
save 60 10000

# save <seconds> <changes>：当 n 秒后有 n 个 key 发生改变，就做一次快照备份
# 在 900 秒内至少 1 次写入触发保存；
# 在 300 秒内 10 次写入触发保存；
# 在 60 秒内 10000 次写入触发保存。

dir /data
# 指定 Redis 持久化文件（RDB/AOF 等）写入的目录路径。默认是 Redis 的工作目录。
# 配置为 /data 意味着快照文件会写到容器内的 /data 目录（如果该目录映射到宿主卷，则会落到宿主上对应卷）

dbfilename dump.rdb
# 指定 RDB 快照文件名，默认通常是 dump.rdb。
# 当 Redis 做 RDB 快照（BGSAVE）时，会在 dir 指定目录下生成一个名为 dump.rdb 的文件

appendonly yes
# 是否开启 AOF（Append Only File）持久化：no 表示不启用 AOF，只使用 RDB（快照）持久化；
# 把它改为 yes 会开启 AOF（每次写命令都会追加到 AOF 日志，提供更高的数据可靠性但增加 IO/延迟和磁盘使用）

#每秒将 os cache 中的数据 fsync 到磁盘，这个最常用的，生产环境一般都这么配置，性能很高，QPS 还是可以上万的
appendfsync everysec

# AOF 自动重写策略（避免日志无限增长）
# 当 aof 日志超过 64 m 且，上一次 aof 之后的文件大小，比如是 60 m，那么当文件增长到 120 m 的时候，就会触发 rewrite 操作
auto-aof-rewrite-percentage 100
# 这个“64mb”是文件大小（磁盘/文件系统上的字节数），不是内存或 CPU 的数值
auto-aof-rewrite-min-size 64mb


# auto-aof-rewrite-percentage 100 与 auto-aof-rewrite-min-size 64mb 是 Redis 用来控制自动触发 AOF（Append Only File）重写（background rewrite，即 BGREWRITEAOF）的阈值设置。AOF 重写的目的是把增长的追加日志进行压缩，去掉冗余命令，从而减小文件体积、加快恢复速度并避免日志无限增大。

# 触发条件（同时满足两项时触发）：

# 百分比条件：当前 AOF 文件大小 S_current 相比上次基线大小 S_base 增长达到或超过配置的百分比 p（这里 p=100% 即增长到基线的两倍）。即 S_current >= S_base * (1 + p/100)。
# 最小尺寸条件：当前 AOF 文件大小 S_current 必须至少达到配置的最小值 S_min（这里 S_min = 64 MB）。
# 因此，给定配置的含义是：当 AOF 比上一次记录的基线大小增长至少 100% 且当前 AOF 大小不小于 64MB 时，Redis 会尝试启动一次 BGREWRITEAOF。
# 为什么要同时设置百分比和最小值：

# 百分比避免在 AOF 频繁微小增长时频繁重写，要求达到显著增长才重写，从而降低重写次数。
# 最小尺寸避免对很小的 AOF 文件做无意义的重写（小文件重写收益小但也有开销），因此设置了一个最小阈值。
# 实际效果与权衡：

# 优点：能自动把 AOF 文件压缩，控制磁盘占用并缩短恢复时间；使用 100% + 64MB 的组合是常见的折中策略，既避免太频繁重写，又在文件显著增大时进行压缩。
# 成本/风险：BGREWRITEAOF 会 fork 一个子进程来生成新 AOF，fork 会消耗系统内存（写时复制）并带来短时间的 CPU 与 IO 压力。在内存或 IO 紧张的机器上，频繁或大型的重写可能导致性能波动或 fork 失败。因此阈值应根据机器内存、负载和 AOF 增长特点调整。
# 行为细节：重写完成后，基线大小 S_base 会更新为新的 AOF 大小（即重写后的大小），下一轮判断将以这个新基线为参照。
# 调优建议：

# 小系统或低写入场景：可以保持较高的百分比（如 100%）与较低的最小值，或只依赖最小值。
# 高频写入环境：如果 AOF 很快增长并且重写本身也很耗资源，可以适当提高 auto-aof-rewrite-min-size（比如 128mb / 256mb）以减少重写频率，或提高百分比阈值。
# 对内存较小的主机：必须谨慎设置，避免重写时 OOM；必要时增加内存或降低并发写入，或选择只用 RDB 或调整 AOF 策略。
# 监控：关注 INFO persistence 中的 aof_rewrite_in_progress、AOF 文件大小、used_memory_rss 与 mem_fragmentation_ratio，以及系统级别的 IO/CPU 使用；若发现 BGREWRITEAOF 触发时系统压力大，应提高阈值或在低峰期手动触发重写。