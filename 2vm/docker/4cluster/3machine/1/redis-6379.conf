# redis-6379.conf (master on this VM)
port 6379
bind 0.0.0.0
protected-mode no
cluster-enabled yes
cluster-config-file nodes-6379.conf
cluster-node-timeout 15000
appendonly yes
appendfsync everysec
# optional auth
# requirepass 123456
# masterauth 123456   # set if requirepass is enabled everywhere
dir /data/6379