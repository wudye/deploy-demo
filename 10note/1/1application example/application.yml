spring:
  application:
    name: geodistance
  config:
    import: optional:file:.env[.properties]

其他协议对比:

协议	示例	说明
file:	file:.env	本地文件系统
classpath:	classpath:config.properties	类路径资源
http:	https://example.com/config.yml	远程 HTTP
configtree:	configtree:/etc/config	Kubernetes ConfigMa

目录结构:
├── application.yml
├── .env              ← 优先级 1
└── .env.properties   ← 优先级 2

如果 .env 存在:
  ✅ 加载 .env，忽略 .env.properties
  
如果 .env 不存在，.env.properties 存在:
  ✅ 加载 .env.properties
  
如果两者都不存在:
  ✅ 跳过导入（因为有 optional）


配置项	作用	关键点
config.import	导入外部配置	Spring Boot 2.4+ 特性
optional:	文件不存在时不报错	软性导入，提高容错性
file:	本地文件系统	相对路径或绝对路径
.env[.properties]	文件名模式	按优先级尝试加载

最佳实践建议
1. 文件命名规范
.env              ← 通用环境变量（开发默认）
.env.dev          ← 开发环境
.env.test         ← 测试环境
.env.prod         ← 生产环境
.env.local        ← 本地覆盖（不提交 Git）

geodistance/
├── src/
│   └── main/
│       └── resources/
│           └── application.yml    ← Spring Boot 配置
├── .env                          ← 环境变量文件
├── pom.xml
└── ...