spring:
  application:
    name: literature-assistant

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Europe/Vienna
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: jdbc:h2:file:./data/literature_assistant   # 持久化到项目目录下
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  sql:
    init:
      schema-locations: classpath:db.sql
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true



# Knife4j 配置


server:
  port: 8086
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true


logging:
  level:
    com.mwu.docuanalyse: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/docuanalyse.log

literature:
  file:
    upload-path: ./uploads/documents
    max-file-size: 100MB
    allowed-extensions: pdf,doc,docx,md,markdown
  ai:
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      model: gemini-2.0-flash-exp
    ollama:
      base-url: http://localhost:11434/v1
      model: llama3.2:latest  # 或 qwen2.5:latest, deepseek-r1:latest
    max-tokens: 20480
    temperature: 0.7
    timeout: 60000

    system-prompt-file: classpath:prompts/literature-guide-system-prompt.txt
    classification-prompt-file: classpath:prompts/literature-classification-system-prompt.txt
